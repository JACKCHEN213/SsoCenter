{extend name="template/index" /}
{block name="title"}会话管理{/block}
{block name="head"}
<style>
    .filter-section { background: #f8f9fa; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .filter-section .form-label { font-size: 0.85rem; margin-bottom: 4px; }
    .session-card { border: 1px solid #e9ecef; border-radius: 6px; padding: 12px; margin-bottom: 12px; background: #fff; }
    .session-card.active { border-color: #198754; background: #f8fff8; }
    .session-card.expired { border-color: #6c757d; background: #f8f9fa; opacity: 0.7; }
    .session-info { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.85rem; margin-bottom: 8px; }
    .session-info-item { display: flex; align-items: center; gap: 4px; }
    .session-info-item .label { color: #6c757d; }
    .session-info-item .value { font-weight: 500; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .status-dot.active { background: #198754; }
    .status-dot.expired { background: #6c757d; }
    .app-auth-table { font-size: 0.85rem; }
    .app-auth-table th { background: #f8f9fa; font-weight: 500; }
    .detail-section { margin-bottom: 20px; }
    .detail-section h6 { background: #f1f3f5; padding: 8px 12px; border-radius: 4px; font-size: 0.9rem; margin-bottom: 12px; font-weight: 600; }
    .detail-section h6 .btn { padding: 0 6px; font-size: 0.75rem; }
    .detail-section h6 .btn i { transition: transform 0.2s; }
    .detail-section h6 .btn.collapsed i { transform: rotate(180deg); }
    .pagination-info { font-size: 0.85rem; color: #6c757d; margin-top: 8px; }
    .btn-action { padding: 2px 8px; font-size: 0.8rem; }
</style>
{/block}

{block name="content"}
<div class="container-xl">
    <h1 class="app-page-title">会话管理</h1>

    <!-- 筛选区域 -->
    <div class="filter-section">
        <div class="row g-3">
            <div class="col-md-3">
                <label class="form-label">用户名</label>
                <input type="text" id="filter-username" class="form-control form-control-sm" placeholder="输入用户名搜索">
            </div>
            <div class="col-md-3 d-flex align-items-end gap-2">
                <button class="btn btn-primary btn-sm" onclick="loadSessions()">查询</button>
                <button class="btn btn-secondary btn-sm" onclick="resetFilter()">重置</button>
            </div>
        </div>
    </div>

    <!-- 会话列表表格 -->
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead>
                <tr>
                    <th style="width: 5%">#</th>
                    <th style="width: 20%">用户名</th>
                    <th style="width: 15%">本系统会话</th>
                    <th style="width: 15%">最近登录 IP</th>
                    <th style="width: 15%">最近登录时间</th>
                    <th style="width: 15%">应用授权</th>
                    <th style="width: 15%">操作</th>
                </tr>
            </thead>
            <tbody id="session-table-body">
                <tr><td colspan="7" class="text-center">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 分页 -->
    <div class="d-flex justify-content-between align-items-center">
        <div class="pagination-info">
            共 <span id="total-count">0</span> 条记录，第 <span id="current-page">1</span> / <span id="total-pages">1</span> 页
        </div>
        <nav>
            <ul class="pagination pagination-sm mb-0">
                <li class="page-item" id="prev-page">
                    <a class="page-link" href="javascript:void(0)" onclick="changePage(-1)">上一页</a>
                </li>
                <li class="page-item" id="next-page">
                    <a class="page-link" href="javascript:void(0)" onclick="changePage(1)">下一页</a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- 会话详情弹窗 -->
    <div class="modal fade" id="sessionDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">会话详情 — <span id="detail-username"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- 本系统登录 -->
                    <div class="detail-section">
                        <h6 class="d-flex align-items-center justify-content-between">
                            <span>本系统登录 <span id="local-sessions-count" class="badge bg-secondary ms-1"></span></span>
                            <button class="btn btn-sm btn-outline-secondary collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#local-sessions-collapse" aria-expanded="false">
                                <i class="bi bi-chevron-down" id="local-sessions-toggle-icon" style="position: relative; top: 1px;"></i>
                            </button>
                        </h6>
                        <div id="local-sessions-collapse" class="collapse">
                            <div id="local-sessions-container">
                                <div class="text-center text-muted">加载中...</div>
                            </div>
                        </div>
                    </div>

                    <!-- 第三方应用授权 -->
                    <div class="detail-section">
                        <h6>第三方应用授权</h6>
                        <div class="table-responsive">
                            <table class="table table-sm app-auth-table">
                                <thead>
                                    <tr>
                                        <th>应用名称</th>
                                        <th>授权码</th>
                                        <th>Access Token</th>
                                        <th>Refresh Token</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody id="app-auth-tbody">
                                    <tr><td colspan="5" class="text-center">加载中...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger btn-sm" onclick="logoutAll()">全部退出</button>
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
const pageSize = 10;
let currentUserId = null;

// 加载会话列表
function loadSessions() {
    const username = document.getElementById('filter-username').value.trim();
    const tbody = document.getElementById('session-table-body');
    tbody.innerHTML = '<tr><td colspan="7" class="text-center">加载中...</td></tr>';

    axiosPost('/session/list', {
        username: username,
        page: currentPage,
        limit: pageSize
    }).then(res => {
        if (res.data.success) {
            const data = res.data.result;
            renderSessionList(data.list, data.total);
        } else {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">${res.data.message}</td></tr>`;
        }
    }).catch(err => {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger">加载失败</td></tr>`;
        console.error(err);
    });
}

// 渲染会话列表
function renderSessionList(list, total) {
    const tbody = document.getElementById('session-table-body');
    if (!list || list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">暂无数据</td></tr>';
        updatePagination(0, 1);
        return;
    }

    let html = '';
    list.forEach((item, index) => {
        const localSessions = item.local_sessions || {};
        const appAuths = item.app_authorizations || [];
        const activeCount = localSessions.active_count || 0;
        const lastIp = localSessions.last_login_ip || '-';
        const lastTime = localSessions.last_login_time || '-';

        html += `
            <tr>
                <td>${(currentPage - 1) * pageSize + index + 1}</td>
                <td>${item.username}</td>
                <td>
                    ${activeCount > 0 ? `<span class="badge bg-success">${activeCount} 个活跃</span>` : '<span class="badge bg-secondary">无活跃</span>'}
                </td>
                <td>${lastIp}</td>
                <td>${lastTime}</td>
                <td>
                    ${appAuths.length > 0 ? `<span class="badge bg-info">${appAuths.length} 个应用</span>` : '<span class="text-muted">-</span>'}
                </td>
                <td>
                    <button class="btn btn-outline-primary btn-action" onclick="showDetail(${item.user_id}, '${item.username}')">详情</button>
                </td>
            </tr>
        `;
    });

    tbody.innerHTML = html;
    const totalPages = Math.ceil(total / pageSize) || 1;
    updatePagination(total, totalPages);
}

// 更新分页
function updatePagination(total, totalPages) {
    document.getElementById('total-count').textContent = total;
    document.getElementById('current-page').textContent = currentPage;
    document.getElementById('total-pages').textContent = totalPages;
    document.getElementById('prev-page').classList.toggle('disabled', currentPage <= 1);
    document.getElementById('next-page').classList.toggle('disabled', currentPage >= totalPages);
}

// 翻页
function changePage(delta) {
    const totalPages = parseInt(document.getElementById('total-pages').textContent);
    const newPage = currentPage + delta;
    if (newPage >= 1 && newPage <= totalPages) {
        currentPage = newPage;
        loadSessions();
    }
}

// 重置筛选
function resetFilter() {
    document.getElementById('filter-username').value = '';
    currentPage = 1;
    loadSessions();
}

// 显示详情弹窗
function showDetail(userId, username) {
    currentUserId = userId;
    document.getElementById('detail-username').textContent = username;
    const modal = new bootstrap.Modal(document.getElementById('sessionDetailModal'));
    modal.show();
    loadDetail(userId);
}

// 加载详情
function loadDetail(userId) {
    const localContainer = document.getElementById('local-sessions-container');
    const appTbody = document.getElementById('app-auth-tbody');
    localContainer.innerHTML = '<div class="text-center text-muted">加载中...</div>';
    appTbody.innerHTML = '<tr><td colspan="5" class="text-center">加载中...</td></tr>';

    axiosPost('/session/detail', { user_id: userId }).then(res => {
        if (res.data.success) {
            const data = res.data.result;
            renderLocalSessions(data.local_sessions || []);
            renderAppAuths(data.app_authorizations || []);
        } else {
            localContainer.innerHTML = `<div class="text-danger">${res.data.message}</div>`;
            appTbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger">加载失败</td></tr>`;
        }
    }).catch(err => {
        localContainer.innerHTML = '<div class="text-danger">加载失败</div>';
        appTbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger">加载失败</td></tr>';
        console.error(err);
    });
}

// 渲染本地会话
function renderLocalSessions(sessions) {
    const container = document.getElementById('local-sessions-container');
    const countBadge = document.getElementById('local-sessions-count');
    const collapseEl = document.getElementById('local-sessions-collapse');
    const toggleBtn = document.querySelector('[data-bs-target="#local-sessions-collapse"]');

    // 更新数量徽标
    countBadge.textContent = sessions ? sessions.length : 0;

    // 如果只有 1 条记录，自动展开
    if (sessions && sessions.length === 1 && collapseEl && !collapseEl.classList.contains('show')) {
        const bsCollapse = new bootstrap.Collapse(collapseEl, { toggle: true });
        if (toggleBtn) toggleBtn.classList.remove('collapsed');
    }

    if (!sessions || sessions.length === 0) {
        container.innerHTML = '<div class="text-muted">无登录记录</div>';
        return;
    }

    let html = '';
    sessions.forEach(session => {
        const isActive = session.is_active;
        const statusClass = isActive ? 'active' : 'expired';
        const statusText = isActive ? '活跃' : '已过期';
        const statusDotClass = isActive ? 'active' : 'expired';

        html += `
            <div class="session-card ${statusClass}">
                <div class="session-info">
                    <div class="session-info-item">
                        <span class="label">IP:</span>
                        <span class="value">${session.ip || '-'}</span>
                    </div>
                    <div class="session-info-item">
                        <span class="label">登录时间:</span>
                        <span class="value">${session.login_time || '-'}</span>
                    </div>
                    <div class="session-info-item">
                        <span class="label">状态:</span>
                        <span class="value"><span class="status-dot ${statusDotClass}"></span> ${statusText}</span>
                    </div>
                </div>
                <div class="session-info">
                    <div class="session-info-item" style="flex: 1;">
                        <span class="label">UA:</span>
                        <span class="value" style="font-size: 0.8rem; color: #6c757d;">${session.user_agent || '-'}</span>
                    </div>
                </div>
                ${isActive ? `<button class="btn btn-outline-danger btn-sm" style="background: #d26d69" onclick="logoutSession(${session.id})">退出此会话</button>` : ''}
            </div>
        `;
    });

    container.innerHTML = html;
}

// 渲染应用授权
function renderAppAuths(auths) {
    const tbody = document.getElementById('app-auth-tbody');
    if (!auths || auths.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">无应用授权</td></tr>';
        return;
    }

    let html = '';
    auths.forEach((auth, index) => {
        const authCodes = auth.auth_codes || [];
        const accessTokens = auth.access_tokens || [];
        const refreshTokens = auth.refresh_tokens || [];
        const activeAccessTokens = accessTokens.filter(t => !t.revoked).length;
        const activeRefreshTokens = refreshTokens.filter(t => !t.revoked).length;
        const collapseId = `collapse-${index}`;

        html += `
            <tr class="app-auth-row" style="cursor: pointer;" onclick="toggleAuthDetail('${collapseId}')">
                <td>
                    <i class="bi bi-chevron-right" id="icon-${collapseId}" style="transition: transform 0.2s;"></i>
                    ${auth.site_name}
                </td>
                <td>${authCodes.length}</td>
                <td>${activeAccessTokens} 个有效</td>
                <td>${activeRefreshTokens} 个有效</td>
                <td>
                    ${activeAccessTokens > 0 || activeRefreshTokens > 0 ?
                        `<button class="btn btn-outline-danger btn-sm" style="background: #d26d69" onclick="event.stopPropagation(); logoutApp(${auth.site_id}, '${auth.site_name}')">退出此应用</button>` :
                        '<span class="text-muted">-</span>'}
                </td>
            </tr>
            <tr id="${collapseId}" class="auth-detail-row" style="display: none;">
                <td colspan="5">
                    <div style="padding: 12px; background: #f8f9fa; border-radius: 4px;">
                        ${renderTokenDetails('授权码', authCodes, 'auth_code')}
                        ${renderTokenDetails('Access Token', accessTokens, 'access_token')}
                        ${renderTokenDetails('Refresh Token', refreshTokens, 'refresh_token')}
                    </div>
                </td>
            </tr>
        `;
    });

    tbody.innerHTML = html;
}

// 渲染 token 详细列表
function renderTokenDetails(title, tokens, type) {
    if (!tokens || tokens.length === 0) {
        return '';
    }

    let html = `
        <div style="margin-bottom: 12px;">
            <div style="font-weight: 600; font-size: 0.85rem; margin-bottom: 8px; color: #495057;">${title} (${tokens.length})</div>
            <div style="font-size: 0.8rem;">
    `;

    tokens.forEach((token, idx) => {
        const isRevoked = token.revoked;
        const statusBadge = isRevoked
            ? '<span class="badge bg-secondary">已撤销</span>'
            : '<span class="badge bg-success">有效</span>';

        const tokenValue = token.token_prefix || token.code || '-';
        const createdAt = token.created_at || '-';
        const expiresAt = token.expires_at || '-';
        const scope = token.scope || '-';

        html += `
            <div style="padding: 8px; background: white; border: 1px solid #e9ecef; border-radius: 4px; margin-bottom: 6px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                    <code style="font-size: 0.75rem; color: #212529;">${tokenValue}</code>
                    ${statusBadge}
                </div>
                <div style="display: flex; gap: 16px; font-size: 0.75rem; color: #6c757d;">
                    <span><strong>Scope:</strong> ${scope}</span>
                    <span><strong>创建:</strong> ${createdAt}</span>
                    <span><strong>过期:</strong> ${expiresAt}</span>
                </div>
            </div>
        `;
    });

    html += `
            </div>
        </div>
    `;

    return html;
}

// 切换授权详情展开/折叠
function toggleAuthDetail(collapseId) {
    const row = document.getElementById(collapseId);
    const icon = document.getElementById(`icon-${collapseId}`);

    if (row.style.display === 'none') {
        row.style.display = 'table-row';
        icon.style.transform = 'rotate(90deg)';
    } else {
        row.style.display = 'none';
        icon.style.transform = 'rotate(0deg)';
    }
}

// 退出指定会话
function logoutSession(sessionId) {
    if (!confirm('确定要退出此会话吗？')) return;

    axiosPost('/session/logout', {
        user_id: currentUserId,
        scope: 'local',
        session_id: sessionId
    }).then(res => {
        if (res.data.success) {
            messageEx('会话已退出', 'success', 800);
            loadDetail(currentUserId);
            loadSessions();
        } else {
            messageEx(res.data.message || '操作失败', 'danger', 800);
        }
    }).catch(err => {
        messageEx('操作失败', 'danger', 800);
        console.error(err);
    });
}

// 退出本系统所有会话
function logoutLocal(userId, username) {
    if (!confirm(`确定要强制退出用户 ${username} 的所有本系统会话吗？`)) return;

    axiosPost('/session/logout', {
        user_id: userId,
        scope: 'local'
    }).then(res => {
        if (res.data.success) {
            messageEx(`已退出 ${res.data.result.local_sessions_revoked} 个会话`, 'success', 800);
            loadSessions();
        } else {
            messageEx(res.data.message || '操作失败', 'danger', 800);
        }
    }).catch(err => {
        messageEx('操作失败', 'danger', 800);
        console.error(err);
    });
}

// 退出指定应用
function logoutApp(siteId, siteName) {
    if (!confirm(`确定要退出用户在 "${siteName}" 的所有授权吗？`)) return;

    axiosPost('/session/logout', {
        user_id: currentUserId,
        scope: 'app',
        site_id: siteId
    }).then(res => {
        if (res.data.success) {
            const result = res.data.result;
            messageEx(`已撤销 ${result.access_tokens_revoked} 个 Access Token`, 'success', 800);
            loadDetail(currentUserId);
            loadSessions();
        } else {
            messageEx(res.data.message || '操作失败', 'danger', 800);
        }
    }).catch(err => {
        messageEx('操作失败', 'danger', 800);
        console.error(err);
    });
}

// 全部退出
function logoutAll() {
    if (!confirm('确定要退出该用户的所有会话和所有应用授权吗？')) return;

    axiosPost('/session/logout', {
        user_id: currentUserId,
        scope: 'all'
    }).then(res => {
        if (res.data.success) {
            const result = res.data.result;
            let msg = `已退出 ${result.local_sessions_revoked} 个本系统会话`;
            if (result.access_tokens_revoked > 0) {
                msg += `，撤销 ${result.access_tokens_revoked} 个 Access Token`;
            }
            if (result.apps_notified && result.apps_notified.length > 0) {
                msg += `，已通知应用: ${result.apps_notified.join(', ')}`;
            }
            messageEx(msg, 'success', 800);
            loadDetail(currentUserId);
            loadSessions();
        } else {
            messageEx(res.data.message || '操作失败', 'danger', 800);
        }
    }).catch(err => {
        messageEx('操作失败', 'danger', 800);
        console.error(err);
    });
}

// 页面加载时初始化
$(document).ready(function() {
    checkLogin();
    activeNav('#nav-session');
    loadSessions();
});
</script>
{/block}
