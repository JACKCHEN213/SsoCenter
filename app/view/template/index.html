    <script src="/assets/js/app.js"></script>
    <script>
        function getToken() {
            try {
                return atob(window.localStorage.getItem('token'));
            } catch (error) {
                return '';
            }
        }

        function checkLogin(callback) {
            let token = getToken();
            if (!token) {
                LoginOut();
            }
            $.ajax({
                url: '/login/verify',
                type: 'POST',
                contentType: 'application/json;charset=utf8',
                data: JSON.stringify({ token }),
                success: (data) => {
                    if (data.success) {
                        // messageEx('登录成功', 'success', 500);
                    } else {
                        LoginOut();
                    }
                },
                error: (error) => {
                    console.error(error);
                    // LoginOut();
                }
            });
        }

        function LoginOut() {
            window.localStorage.removeItem('token');
            window.location.href = '/login';
        }

        function clearNav() {
            $('#app-nav-main .nav-link').removeClass('active');
            $('.submenu-item').removeClass('active');
            $('.submenu').removeClass('show');
        }

        function activeNav(id = '#nav-index') {
            $(id).addClass('active');
        }

        function showCollapse(id) {
            $(id).addClass('show');
        }

        function init() {
            clearNav();
            checkLogin();
        }

        init();

        // ========== 公共 axios 请求封装 ==========

        // 创建 axios 实例，统一配置基础参数
        const axiosInstance = axios.create({
            timeout: 30000,
            headers: {
                'Content-Type': 'application/json;charset=UTF-8'
            }
        });

        // 请求拦截器：自动添加 Authorization 头
        axiosInstance.interceptors.request.use(
            function (config) {
                const token = getToken();
                if (token) {
                    config.headers['Authorization'] = token;
                }
                return config;
            },
            function (error) {
                return Promise.reject(error);
            }
        );

        // 响应拦截器：统一处理响应
        axiosInstance.interceptors.response.use(
            function (response) {
                if (response.data.code == 10007) {
                    return LoginOut();
                }
                return response;
            },
            function (error) {
                // 401 未授权，跳转登录
                if (error.response && error.response.status === 401) {
                    LoginOut();
                }
                return Promise.reject(error);
            }
        );

        /**
         * GET 请求
         * @param {string} url 请求地址
         * @param {object} params 查询参数
         * @returns {Promise}
         */
        function axiosGet(url, params = {}) {
            return axiosInstance.get(url, { params: params });
        }

        /**
         * POST 请求
         * @param {string} url 请求地址
         * @param {object} data 请求体数据
         * @returns {Promise}
         */
        function axiosPost(url, data = {}) {
            return axiosInstance.post(url, data);
        }

        /**
         * PUT 请求
         * @param {string} url 请求地址
         * @param {object} data 请求体数据
         * @returns {Promise}
         */
        function axiosPut(url, data = {}) {
            return axiosInstance.put(url, data);
        }

        /**
         * DELETE 请求
         * @param {string} url 请求地址
         * @param {object} data 请求体数据
         * @returns {Promise}
         */
        function axiosDelete(url, data = {}) {
            return axiosInstance.delete(url, { data: data });
        }
    </script>
