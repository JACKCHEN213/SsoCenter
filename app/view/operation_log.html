{extend name="template/index" /}
{block name="title"}操作日志{/block}
{block name="head"}
<style>
    .result-badge { font-size: 0.85rem; padding: 4px 10px; }
    .result-badge.success { background: #d1e7dd; color: #0f5132; }
    .result-badge.failure { background: #f8d7da; color: #842029; }
    .filter-section { background: #f8f9fa; padding: 16px; border-radius: 8px; margin-bottom: 16px; }
    .filter-section .form-label { font-size: 0.85rem; margin-bottom: 4px; }
    .detail-section { margin-bottom: 16px; }
    .detail-section h6 { background: #f1f3f5; padding: 8px 12px; border-radius: 4px; font-size: 0.85rem; margin-bottom: 8px; }
    .detail-section pre { background: #f8f9fa; padding: 12px; border-radius: 4px; font-size: 0.8rem; max-height: 300px; overflow-y: auto; margin: 0; white-space: pre-wrap; word-break: break-all; border: 1px solid #e9ecef; }
    .detail-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .detail-row .badge { font-size: 0.8rem; }
    .detail-row code { font-size: 0.82rem; background: #f1f3f5; padding: 2px 6px; border-radius: 3px; }
    .pagination-info { font-size: 0.85rem; color: #6c757d; margin-top: 8px; }
</style>
{/block}

{block name="content"}
<div class="container-xl">
    <h1 class="app-page-title">操作日志</h1>

    <!-- 筛选区域 -->
    <div class="filter-section">
        <div class="row g-3">
            <div class="col-md-2">
                <label class="form-label">操作模块</label>
                <select id="filter-module" class="form-select form-select-sm">
                    <option value="">全部</option>
                    <option value="auth">认证</option>
                    <option value="app">应用</option>
                    <option value="user">用户</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">操作动作</label>
                <select id="filter-action" class="form-select form-select-sm">
                    <option value="">全部</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label">操作者</label>
                <input type="text" id="filter-operator" class="form-control form-control-sm" placeholder="用户名">
            </div>
            <div class="col-md-2">
                <label class="form-label">开始时间</label>
                <input type="datetime-local" id="filter-start-time" class="form-control form-control-sm">
            </div>
            <div class="col-md-2">
                <label class="form-label">结束时间</label>
                <input type="datetime-local" id="filter-end-time" class="form-control form-control-sm">
            </div>
            <div class="col-md-2 d-flex align-items-end gap-2">
                <button class="btn btn-primary btn-sm" onclick="loadLogs()">查询</button>
                <button class="btn btn-secondary btn-sm" onclick="resetFilter()">重置</button>
            </div>
        </div>
    </div>

    <!-- 日志表格 -->
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle" style="word-break:break-all;">
            <thead>
                <tr>
                    <th style="width: 5%">#</th>
                    <th style="width: 14%">时间</th>
                    <th style="width: 10%">操作者</th>
                    <th style="width: 8%">模块</th>
                    <th style="width: 12%">动作</th>
                    <th style="width: 15%">操作对象</th>
                    <th style="width: 10%">结果</th>
                    <th style="width: 12%">IP</th>
                    <th style="width: 8%">操作</th>
                </tr>
            </thead>
            <tbody id="log-table-body">
                <tr><td colspan="9" class="text-center">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 分页 -->
    <div class="d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
            <div class="pagination-info">
                共 <span id="total-count">0</span> 条记录，第 <span id="current-page">1</span> / <span id="total-pages">1</span> 页
            </div>
            <div class="d-flex align-items-center gap-2">
                <label class="form-label mb-0" style="font-size: 0.85rem;">每页</label>
                <select id="page-size" class="form-select form-select-sm" style="width: auto;" onchange="changePageSize()">
                    <option value="5">5</option>
                    <option value="10">10</option>
                    <option value="20">20</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                </select>
                <label class="form-label mb-0" style="font-size: 0.85rem;">条</label>
            </div>
        </div>
        <nav>
            <ul class="pagination pagination-sm mb-0" id="pagination">
                <li class="page-item" id="first-page">
                    <a class="page-link" href="javascript:void(0)" onclick="goToPage(1)">首页</a>
                </li>
                <li class="page-item" id="prev-page">
                    <a class="page-link" href="javascript:void(0)" onclick="changePage(-1)">上一页</a>
                </li>
                <!-- 动态页码插入这里 -->
                <li class="page-item" id="next-page">
                    <a class="page-link" href="javascript:void(0)" onclick="changePage(1)">下一页</a>
                </li>
                <li class="page-item" id="last-page">
                    <a class="page-link" href="javascript:void(0)" onclick="goToPage(-1)">末页</a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detailModalLabel">日志详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="detail-content">
                    <!-- 动态填充 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>
</div>
{/block}

{block name="script"}
<script>
    // 当前页码和每页条数
    let currentPage = 1;
    let pageSize = 5;

    // 模块和动作映射
    const moduleMap = {
        'auth': '认证',
        'app': '应用',
        'user': '用户'
    };

    const actionMap = {
        'login': '登录',
        'logout': '登出',
        'app_create': '创建应用',
        'app_update': '修改应用',
        'app_delete': '删除应用',
        'app_reset_secret': '重置 APP_KEY',
        'app_view_secret': '查看 APP_KEY',
        'user_create': '新增用户',
        'user_update': '修改用户',
        'user_delete': '删除用户',
        'user_push': '推送用户',
        'user_push_all': '批量推送'
    };

    // 模块对应的动作选项
    const moduleActions = {
        'auth': ['login', 'logout'],
        'app': ['app_create', 'app_update', 'app_delete', 'app_reset_secret', 'app_view_secret'],
        'user': ['user_create', 'user_update', 'user_delete', 'user_push', 'user_push_all']
    };

    // 模块变更时更新动作下拉
    document.getElementById('filter-module').addEventListener('change', function() {
        const module = this.value;
        const actionSelect = document.getElementById('filter-action');
        actionSelect.innerHTML = '<option value="">全部</option>';
        if (module && moduleActions[module]) {
            moduleActions[module].forEach(action => {
                const option = document.createElement('option');
                option.value = action;
                option.textContent = actionMap[action] || action;
                actionSelect.appendChild(option);
            });
        }
    });

    // 页面加载完成后加载日志
    document.addEventListener('DOMContentLoaded', function() {
        checkLogin();
        activeNav('#nav-operation-log');
        loadLogs();
    });

    // 加载日志列表
    function loadLogs(page = 1) {
        currentPage = page;
        const data = {
            page: currentPage,
            page_size: pageSize
        };

        const module = document.getElementById('filter-module').value;
        const action = document.getElementById('filter-action').value;
        const operator = document.getElementById('filter-operator').value;
        const startTime = document.getElementById('filter-start-time').value;
        const endTime = document.getElementById('filter-end-time').value;

        if (module) data.module = module;
        if (action) data.action = action;
        if (operator) data.operator_name = operator;
        if (startTime) data.start_time = startTime.replace('T', ' ');
        if (endTime) data.end_time = endTime.replace('T', ' ');

        axiosPost('/operation_log/list', data).then(res => {
            if (res.data.success) {
                renderLogs(res.data.result);
            } else {
                showToast(res.data.message || '加载失败', 'error');
            }
        }).catch(err => {
            showToast('网络错误', 'error');
            console.error(err);
        });
    }

    // 渲染日志列表
    function renderLogs(result) {
        const tbody = document.getElementById('log-table-body');
        if (!result.list || result.list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">暂无数据</td></tr>';
            updatePagination(0, 1);
            return;
        }

        let html = '';
        result.list.forEach((log, index) => {
            const rowNum = (currentPage - 1) * pageSize + index + 1;
            const moduleText = moduleMap[log.module] || log.module;
            const actionText = actionMap[log.action] || log.action;
            const targetText = log.target_name || '—';
            const resultBadge = log.result === 'success'
                ? '<span class="badge result-badge success">✓ 成功</span>'
                : '<span class="badge result-badge failure">✗ 失败</span>';
            const time = log.created_at ? log.created_at.substring(5, 16) : '—';

            html += `
                <tr>
                    <td>${rowNum}</td>
                    <td>${time}</td>
                    <td>${log.operator_name || '—'}</td>
                    <td><span class="badge bg-secondary">${moduleText}</span></td>
                    <td>${actionText}</td>
                    <td>${targetText}</td>
                    <td>${resultBadge}</td>
                    <td>${log.ip || '—'}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="viewDetail(${log.id})">详情</button>
                    </td>
                </tr>
            `;
        });
        tbody.innerHTML = html;

        const totalPages = Math.ceil(result.total / pageSize) || 1;
        updatePagination(result.total, totalPages);
    }

    // 更新分页信息
    function updatePagination(total, totalPages) {
        document.getElementById('total-count').textContent = total;
        document.getElementById('current-page').textContent = currentPage;
        document.getElementById('total-pages').textContent = totalPages;

        // 更新上一页/下一页/首页/末页的禁用状态
        document.getElementById('first-page').classList.toggle('disabled', currentPage <= 1);
        document.getElementById('prev-page').classList.toggle('disabled', currentPage <= 1);
        document.getElementById('next-page').classList.toggle('disabled', currentPage >= totalPages);
        document.getElementById('last-page').classList.toggle('disabled', currentPage >= totalPages);

        // 生成页码按钮
        renderPageNumbers(totalPages);
    }

    // 渲染页码按钮
    function renderPageNumbers(totalPages) {
        const pagination = document.getElementById('pagination');
        const nextPage = document.getElementById('next-page');

        // 移除旧的页码按钮（保留首页、上一页、下一页、末页）
        const itemsToRemove = pagination.querySelectorAll('.page-number-item');
        itemsToRemove.forEach(item => item.remove());

        // 显示页码逻辑：最多显示 5 个页码按钮
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + 4);

        // 调整起始页，确保显示 5 个（如果可能）
        if (endPage - startPage < 4) {
            startPage = Math.max(1, endPage - 4);
        }

        // 在"下一页"按钮前插入页码
        for (let i = startPage; i <= endPage; i++) {
            const li = document.createElement('li');
            li.className = 'page-item page-number-item' + (i === currentPage ? ' active' : '');
            li.innerHTML = `<a class="page-link" href="javascript:void(0)" onclick="goToPage(${i})">${i}</a>`;
            pagination.insertBefore(li, nextPage);
        }
    }

    // 跳转到指定页
    function goToPage(page) {
        const totalPages = parseInt(document.getElementById('total-pages').textContent);
        if (page === -1) {
            // 末页
            page = totalPages;
        }
        if (page >= 1 && page <= totalPages && page !== currentPage) {
            loadLogs(page);
        }
    }

    // 切换页码
    function changePage(delta) {
        const totalPages = parseInt(document.getElementById('total-pages').textContent);
        const newPage = currentPage + delta;
        if (newPage >= 1 && newPage <= totalPages) {
            loadLogs(newPage);
        }
    }

    // 切换每页条数
    function changePageSize() {
        pageSize = parseInt(document.getElementById('page-size').value);
        loadLogs(1); // 重置到第一页
    }

    // 重置筛选
    function resetFilter() {
        document.getElementById('filter-module').value = '';
        document.getElementById('filter-action').innerHTML = '<option value="">全部</option>';
        document.getElementById('filter-operator').value = '';
        document.getElementById('filter-start-time').value = '';
        document.getElementById('filter-end-time').value = '';
        loadLogs(1);
    }

    // 查看详情
    function viewDetail(id) {
        axiosPost('/operation_log/detail', { id: id }).then(res => {
            if (res.data.success && res.data.result) {
                renderDetail(res.data.result);
                new bootstrap.Modal(document.getElementById('detailModal')).show();
            } else {
                showToast('加载详情失败', 'error');
            }
        }).catch(err => {
            showToast('网络错误', 'error');
            console.error(err);
        });
    }

    // 渲染详情
    function renderDetail(log) {
        const moduleText = moduleMap[log.module] || log.module;
        const actionText = actionMap[log.action] || log.action;
        const resultBadge = log.result === 'success'
            ? '<span class="badge bg-success">✓ 成功</span>'
            : '<span class="badge bg-danger">✗ 失败</span>';

        let html = `
            <div class="detail-section">
                <div class="detail-row">
                    <div><strong>操作者:</strong> <code>${log.operator_name || '—'}</code></div>
                    <div><strong>时间:</strong> <code>${log.created_at || '—'}</code></div>
                    <div><strong>IP:</strong> <code>${log.ip || '—'}</code></div>
                </div>
                <div class="detail-row">
                    <div><strong>User-Agent:</strong> <code>${log.user_agent || '—'}</code></div>
                </div>
                <div class="detail-row">
                    <div><strong>模块:</strong> <span class="badge bg-secondary">${moduleText}</span></div>
                    <div><strong>动作:</strong> ${actionText}</div>
                    <div><strong>结果:</strong> ${resultBadge}</div>
                </div>
                ${log.target_name ? `
                <div class="detail-row">
                    <div><strong>操作对象:</strong> <code>${log.target_name}</code> ${log.target_id ? `(ID: ${log.target_id})` : ''}</div>
                </div>
                ` : ''}
                ${log.result_message ? `
                <div class="detail-row">
                    <div><strong>结果描述:</strong> ${log.result_message}</div>
                </div>
                ` : ''}
            </div>
        `;

        // 请求数据
        if (log.request_data) {
            html += `
                <div class="detail-section">
                    <h6><i class="bi bi-box-arrow-up-right"></i> 请求数据</h6>
                    <pre>${formatJson(log.request_data)}</pre>
                </div>
            `;
        }

        // 响应数据
        if (log.response_data) {
            html += `
                <div class="detail-section">
                    <h6><i class="bi bi-box-arrow-in-down-left"></i> 响应数据</h6>
                    <pre>${formatJson(log.response_data)}</pre>
                </div>
            `;
        }

        // 关联记录
        if (log.related_type && log.related_id) {
            html += `
                <div class="detail-section">
                    <div class="detail-row">
                        <div><strong>关联:</strong> <code>${log.related_type} #${log.related_id}</code></div>
                    </div>
                </div>
            `;
        }

        document.getElementById('detail-content').innerHTML = html;
    }

    // 格式化 JSON
    function formatJson(data) {
        if (typeof data === 'string') {
            try {
                data = JSON.parse(data);
            } catch (e) {
                return escapeHtml(data);
            }
        }
        return escapeHtml(JSON.stringify(data, null, 2));
    }

    // HTML 转义
    function escapeHtml(str) {
        if (typeof str !== 'string') {
            str = String(str);
        }
        return str
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    // 显示提示
    function showToast(message, type = 'info') {
        if (typeof UIToastr !== 'undefined') {
            UIToastr.show(message, type);
        } else {
            alert(message);
        }
    }
</script>
{/block}
